# 개인 Git 계정과 서명, API 및 UI 검사를 실행한다.
pre-commit:
  parallel: true
  commands:
    git-identity:
      files: git ls-files
      run: node scripts/check-git-identity.mjs pre-commit
    api-types:
      glob: "api/**/*.{ts,json,yaml}"
      run: task api:lint
    ui-types:
      glob: "ui/**/*.{ts,tsx,json}"
      run: task ui:lint
pre-push:
  commands:
    git-identity:
      files: git ls-files
      use_stdin: true
      run: node scripts/check-git-identity.mjs pre-push
    api-test:
      run: task api:test
