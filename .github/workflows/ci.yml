name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      activity-cache:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm 활성화
        run: corepack enable
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 정적 검사
        run: pnpm lint
      - name: 테스트
        run: pnpm test
      - name: Redis 캐시 통합 테스트
        run: pnpm test:cache
        env:
          RECAP_TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: 빌드
        run: pnpm build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm 활성화
        run: corepack enable
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 정적 검사
        run: pnpm lint
      - name: 빌드
        run: pnpm build
