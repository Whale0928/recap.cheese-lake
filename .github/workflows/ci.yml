name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm 활성화
        run: corepack enable
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 정적 검사
        run: pnpm lint
      - name: 테스트
        run: pnpm test
      - name: 빌드
        run: pnpm build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm 활성화
        run: corepack enable
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 정적 검사
        run: pnpm lint
      - name: 빌드
        run: pnpm build
