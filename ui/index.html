<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>recap · 로그인 확인</title>
<style>
  :root {
    --ground: #edf0ec; --surface: #fdfdfc; --sunk: #e4e9e4;
    --ink: #16231c; --muted: #5a6b60; --faint: #8a9990;
    --rule: #d2dad3;
    --accent: #12805a; --accent-soft: #d6eae0;
    --bad: #a33b2a; --bad-soft: #f2dfda;
    --mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1512; --surface: #171f1a; --sunk: #131a16;
      --ink: #e3ebe5; --muted: #91a297; --faint: #6b7c72;
      --rule: #2a342e;
      --accent: #41d69c; --accent-soft: #163025;
      --bad: #e27a62; --bad-soft: #321d18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all;
  }
  main { max-width: 56rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; display: flex; flex-direction: column; gap: 2rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  h2 { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
       font-family: var(--mono); font-weight: 600; margin: 0 0 .75rem; }
  p { margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem 1.35rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; }
  button {
    font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    padding: .55rem 1.05rem; border-radius: 5px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dl { margin: 0; display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: .45rem 1.1rem; }
  dt { font-family: var(--mono); font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding-top: .18rem; }
  dd { margin: 0; font-family: var(--mono); font-size: .84rem; overflow-wrap: anywhere; }
  .pill { display: inline-block; font-family: var(--mono); font-size: .72rem; font-weight: 600;
          padding: .12rem .5rem; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
       color: var(--faint); background: var(--sunk); }
  tbody tr:last-child td { border-bottom: none; }
  td.u { font-family: var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
  pre { margin: 0; padding: 1rem 1.1rem; font-family: var(--mono); font-size: .8rem; line-height: 1.6;
        overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  .err { background: var(--bad-soft); color: var(--bad); border-radius: 5px; padding: .7rem .9rem; font-size: .88rem; }
  .hide { display: none; }
</style>
</head>
<body>
<main>

  <header>
    <h1>recap 로그인 확인</h1>
    <p class="sub">치지직 OAuth 여덟 단계가 실제로 도는지 보는 화면입니다. 토큰은 확인 직후 폐기됩니다.</p>
  </header>

  <section class="card">
    <h2>동작</h2>
    <div class="row">
      <button class="primary" onclick="location.href='/auth/login'">치지직으로 로그인</button>
      <button onclick="logout()">로그아웃</button>
      <button onclick="checkLives()">Client 인증 확인 (라이브 목록)</button>
      <button onclick="load()">새로고침</button>
    </div>
  </section>

  <section id="err-box" class="hide"><p class="err" id="err"></p></section>

  <section class="card">
    <h2>세션</h2>
    <div id="session"></div>
  </section>

  <section class="card">
    <h2>마지막 로그인</h2>
    <div id="login"></div>
  </section>

  <section id="trace-box" class="hide">
    <h2>오간 호출</h2>
    <div class="wrap"><table>
      <thead><tr><th>#</th><th>단계</th><th>요청</th><th>상태</th><th>ms</th></tr></thead>
      <tbody id="trace"></tbody>
    </table></div>
  </section>

  <section id="lives-box" class="hide">
    <h2>라이브 목록 응답</h2>
    <pre id="lives"></pre>
  </section>

</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function dl(pairs) {
  const rows = pairs.filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  return rows ? `<dl>${rows}</dl>` : `<p class="sub">없음</p>`;
}

function pill(ok, yes, no) {
  return `<span class="pill${ok ? "" : " bad"}">${ok ? yes : no}</span>`;
}

async function load() {
  let d;
  try {
    d = await (await fetch("/api/session")).json();
  } catch (e) {
    return fail("서버에 닿지 못했습니다: " + e.message);
  }
  $("err-box").classList.add("hide");

  $("session").innerHTML = d.loggedIn
    ? dl([
        ["상태", pill(true, "로그인됨")],
        ["channelId", esc(d.session.channelId)],
        ["channelName", esc(d.session.channelName)],
        ["쿠키 만료", esc(new Date(d.session.expiresAt).toLocaleString("ko-KR"))],
      ])
    : dl([
        ["상태", pill(false, "", "로그인 안 됨")],
        ["sessionError", esc(d.sessionError)],
        ["redirectUri", esc(d.config.redirectUri)],
        ["clientId", esc(d.config.clientId)],
      ]);

  const r = d.lastLogin;
  if (!r) {
    $("login").innerHTML = `<p class="sub">아직 로그인을 시도하지 않았습니다.</p>`;
    $("trace-box").classList.add("hide");
    return;
  }

  $("login").innerHTML = dl([
    ["결과", r.ok ? pill(true, "성공") : pill(false, "", "실패")],
    ["시각", esc(new Date(r.at).toLocaleString("ko-KR"))],
    ["오류", r.error ? `<span style="color:var(--bad)">${esc(r.error)}</span>` : ""],
    ["channelId", esc(r.user?.channelId)],
    ["channelName", esc(r.user?.channelName)],
    ["tokenType", esc(r.tokenType)],
    ["expiresIn", r.expiresIn ? esc(r.expiresIn) + "초 (" + Math.round(r.expiresIn / 3600) + "시간)" : ""],
    ["scope", esc(r.scope)],
    ["accessToken", esc(r.accessToken || r.accessTokenPreview)],
    ["refreshToken", esc(r.refreshToken || r.refreshTokenPreview)],
    ["폐기", r.revoked ? pill(true, "완료") : pill(false, "", "실패")],
    ["폐기 확인", r.revoked ? (r.revokeVerified ? pill(true, "토큰 죽음 확인") : pill(false, "", "아직 살아 있음")) : ""],
    ["폐기 오류", r.revokeError ? `<span style="color:var(--bad)">${esc(r.revokeError)}</span>` : ""],
  ]);

  renderTrace(r.trace);
}

function renderTrace(trace) {
  const steps = trace?.steps ?? [];
  if (!steps.length) { $("trace-box").classList.add("hide"); return; }
  $("trace-box").classList.remove("hide");
  $("trace").innerHTML = steps.map(s => `
    <tr>
      <td class="n">${s.seq}</td>
      <td>${esc(s.label)}${s.detail ? `<br><span class="sub" style="color:${s.ok ? "var(--muted)" : "var(--bad)"}">${esc(s.detail)}</span>` : ""}</td>
      <td class="u">${s.method ? esc(s.method) + " " : ""}${esc(s.url)}</td>
      <td>${s.status ? pill(s.ok, s.status, s.status || "실패") : pill(s.ok, "-", "실패")}</td>
      <td class="n">${s.tookMs ?? ""}</td>
    </tr>`).join("");
}

async function checkLives() {
  const d = await (await fetch("/api/lives")).json();
  $("lives-box").classList.remove("hide");
  $("lives").textContent = d.ok
    ? JSON.stringify(d.content, null, 2).slice(0, 4000)
    : "실패: " + d.error;
  renderTrace(d.trace);
}

async function logout() {
  await fetch("/auth/logout", { method: "POST" });
  $("lives-box").classList.add("hide");
  load();
}

function fail(msg) {
  $("err-box").classList.remove("hide");
  $("err").textContent = msg;
}

load();
</script>
</body>
</html>
