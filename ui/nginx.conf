server {
    listen 8080;
    server_name _;
    # 외부 Gateway의 호스트·포트를 유지하도록 상대 경로로 이동한다.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # UI 미리보기에서는 빈 리캡 페이지를 연다.
    location = /auth/login {
        return 302 /recap/;
    }

    location /auth/ {
        return 404;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"API is not available in this UI preview"}';
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /auth/\nDisallow: /api/\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
