<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>recap · 로그인 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/components.css">
<style>
  /* 이 화면에만 필요한 레이아웃. 디자인 시스템에는 넣지 않는다 */
  main { max-width: 54rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem;
         display: flex; flex-direction: column; gap: 1.5rem; }
  h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 .3rem; }
  .sub { color: var(--muted-foreground); margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: .625rem; }
  /* 키-값 목록 — 확인용 화면에만 쓰는 형태라 컴포넌트로 승격하지 않았다 */
  .kv { margin: 0; display: grid; grid-template-columns: minmax(6.5rem, auto) 1fr; gap: .4rem 1rem; }
  .kv dt { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .06em;
           text-transform: uppercase; color: var(--muted-foreground); padding-top: .15rem; }
  .kv dd { margin: 0; font-family: var(--font-mono); font-size: .8125rem; overflow-wrap: anywhere; }
  .wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg);
          background: var(--card); }
  pre { margin: 0; padding: 1rem 1.1rem; overflow-x: auto; background: var(--card);
        border: 1px solid var(--border); border-radius: var(--radius-lg);
        font-family: var(--font-mono); font-size: .8125rem; line-height: 1.6; }
  .hide { display: none; }
</style>
</head>
<body>
<main>

  <header>
    <h1>recap 로그인 확인</h1>
    <p class="sub">치지직 OAuth 여덟 단계가 실제로 도는지 보는 화면입니다. 토큰은 확인 직후 폐기됩니다.</p>
  </header>

  <div class="row">
    <button class="btn btn-default" onclick="location.href='/auth/login'">치지직으로 로그인</button>
    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
    <button class="btn btn-outline" onclick="checkLives()">Client 인증 확인</button>
    <button class="btn btn-ghost" onclick="load()">새로고침</button>
  </div>

  <div id="err-box" class="hide">
    <div class="alert alert-destructive">
      <p class="alert-title">서버에 닿지 못했습니다</p>
      <p class="alert-description" id="err"></p>
    </div>
  </div>

  <section class="card">
    <div class="card-header"><h2 class="card-title">세션</h2></div>
    <div class="card-content" id="session"></div>
  </section>

  <section class="card">
    <div class="card-header"><h2 class="card-title">마지막 로그인</h2></div>
    <div class="card-content" id="login"></div>
  </section>

  <section id="trace-box" class="hide">
    <div class="wrap"><table class="table">
      <thead><tr><th>#</th><th>단계</th><th>요청</th><th>상태</th><th style="text-align:right">ms</th></tr></thead>
      <tbody id="trace"></tbody>
    </table></div>
  </section>

  <section id="lives-box" class="hide"><pre id="lives"></pre></section>

</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function kv(pairs) {
  const rows = pairs.filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  return rows ? `<dl class="kv">${rows}</dl>` : `<p class="sub">없음</p>`;
}

function badge(ok, yes, no) {
  return `<span class="badge ${ok ? "badge-default" : "badge-destructive"}">${ok ? yes : no}</span>`;
}

async function load() {
  let d;
  try {
    d = await (await fetch("/api/session")).json();
  } catch (e) {
    return fail(e.message);
  }
  $("err-box").classList.add("hide");

  $("session").innerHTML = d.loggedIn
    ? kv([
        ["상태", badge(true, "로그인됨")],
        ["channelId", esc(d.session.channelId)],
        ["channelName", esc(d.session.channelName)],
        ["쿠키 만료", esc(new Date(d.session.expiresAt).toLocaleString("ko-KR"))],
      ])
    : kv([
        ["상태", badge(false, "", "로그인 안 됨")],
        ["sessionError", esc(d.sessionError)],
        ["redirectUri", esc(d.config.redirectUri)],
        ["clientId", esc(d.config.clientId)],
      ]);

  const r = d.lastLogin;
  if (!r) {
    $("login").innerHTML = `<p class="sub">아직 로그인을 시도하지 않았습니다.</p>`;
    $("trace-box").classList.add("hide");
    return;
  }

  $("login").innerHTML = kv([
    ["결과", r.ok ? badge(true, "성공") : badge(false, "", "실패")],
    ["시각", esc(new Date(r.at).toLocaleString("ko-KR"))],
    ["오류", r.error ? `<span style="color:var(--destructive)">${esc(r.error)}</span>` : ""],
    ["channelId", esc(r.user?.channelId)],
    ["channelName", esc(r.user?.channelName)],
    ["tokenType", esc(r.tokenType)],
    ["expiresIn", r.expiresIn ? esc(r.expiresIn) + "초 (" + Math.round(r.expiresIn / 3600) + "시간)" : ""],
    ["scope", esc(r.scope)],
    ["accessToken", esc(r.accessToken || r.accessTokenPreview)],
    ["refreshToken", esc(r.refreshToken || r.refreshTokenPreview)],
    ["폐기", r.revoked ? badge(true, "완료") : badge(false, "", "실패")],
    ["폐기 확인", r.revoked ? (r.revokeVerified ? badge(true, "토큰 죽음 확인") : badge(false, "", "아직 살아 있음")) : ""],
    ["폐기 오류", r.revokeError ? `<span style="color:var(--destructive)">${esc(r.revokeError)}</span>` : ""],
  ]);

  renderTrace(r.trace);
}

function renderTrace(trace) {
  const steps = trace?.steps ?? [];
  if (!steps.length) { $("trace-box").classList.add("hide"); return; }
  $("trace-box").classList.remove("hide");
  $("trace").innerHTML = steps.map(s => `
    <tr>
      <td class="tabular">${s.seq}</td>
      <td>${esc(s.label)}${s.detail ? `<br><span style="color:${s.ok ? "var(--muted-foreground)" : "var(--destructive)"}">${esc(s.detail)}</span>` : ""}</td>
      <td style="color:var(--muted-foreground); overflow-wrap:anywhere">${s.method ? esc(s.method) + " " : ""}${esc(s.url)}</td>
      <td>${s.status ? badge(s.ok, s.status, s.status || "실패") : badge(s.ok, "-", "실패")}</td>
      <td class="tabular" style="text-align:right">${s.tookMs ?? ""}</td>
    </tr>`).join("");
}

async function checkLives() {
  const d = await (await fetch("/api/lives")).json();
  $("lives-box").classList.remove("hide");
  $("lives").textContent = d.ok
    ? JSON.stringify(d.content, null, 2).slice(0, 4000)
    : "실패: " + d.error;
  renderTrace(d.trace);
}

async function logout() {
  await fetch("/auth/logout", { method: "POST" });
  $("lives-box").classList.add("hide");
  load();
}

function fail(msg) {
  $("err-box").classList.remove("hide");
  $("err").textContent = msg;
}

load();
</script>
</body>
</html>
