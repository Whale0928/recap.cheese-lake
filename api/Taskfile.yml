version: '3'

tasks:
  install:
    desc: API 의존성 설치
    cmds:
      - pnpm install --frozen-lockfile
  build:
    desc: NestJS API 빌드
    cmds:
      - pnpm build
  lint:
    desc: API TypeScript 정적 검사
    cmds:
      - pnpm lint
  test:
    desc: 인증 단위 및 HTTP 통합 테스트
    cmds:
      - pnpm test
  test:cache:
    desc: 전용 Redis를 이용한 활동 캐시 통합 테스트
    cmds:
      - pnpm test:cache
  serve:
    desc: 빌드된 API 기동
    deps: [build]
    cmds:
      - pnpm start
  dev:
    desc: UI를 빌드하고 로컬 인증 API 기동
    cmds:
      - task --dir ../ui build
      - pnpm build
      - task: watch
  watch:
    internal: true
    deps: [watch:build, watch:serve]
  watch:build:
    internal: true
    cmds:
      - pnpm build:watch
  watch:serve:
    internal: true
    cmds:
      - pnpm dev
  image:
    desc: API 이미지 로컬 빌드
    cmds:
      - docker build --build-context recap_migrations=../module.secrets/project/cheese-lake/recap/db/migrations -t recap-api:local .
